apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: path-routing
  namespace: default
spec:
  ingressClassName: traefik

  rules:
    - host: path.zahaan.online
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: app2-service
                port:
                  number: 80

          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1-service
                port:
                  number: 80
