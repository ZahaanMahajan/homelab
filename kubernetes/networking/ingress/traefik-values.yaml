# Traefik Helm chart: 41.6.0
# MetalLB provides the LoadBalancer IP.

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik

ports:
  web:
    port: 8000
    exposedPort: 80
    expose:
      default: true
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    port: 8443
    exposedPort: 443
    expose:
      default: true

service:
  enabled: true
  annotations:
    metallb.io/loadBalancerIPs: "192.168.29.240"
  spec:
    type: LoadBalancer
