# Do not deploy duplicate exporters.
nodeExporter:
  enabled: false

kubeStateMetrics:
  enabled: false

# Grafana
grafana:
  enabled: true

  persistence:
    enabled: true
    type: pvc
    storageClassName: nfs-storage
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  service:
    type: ClusterIP

# Prometheus Operator-managed Prometheus
prometheus:
  enabled: true

  service:
    type: ClusterIP

  prometheusSpec:
    replicas: 1
    retention: 7d

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-storage
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 8Gi

# Alertmanager
alertmanager:
  enabled: true

  service:
    type: ClusterIP

  alertmanagerSpec:
    replicas: 1

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-storage
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
