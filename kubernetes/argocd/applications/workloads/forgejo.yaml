
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ZahaanMahajan/homelab.git
    targetRevision: main
    path: kubernetes/applications/forgejo
    helm:
      releaseName: forgejo

  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo

  syncPolicy:
    syncOptions:
      - CreateNamespace=false

