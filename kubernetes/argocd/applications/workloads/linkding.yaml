apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: linkding
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ZahaanMahajan/homelab.git
    targetRevision: v2.0.0
    path: kubernetes/applications/linkding
    directory:
      exclude: "**/*.sops.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: linkding

  syncPolicy:
    automated:
      selfHeal: true
      prune: false

    syncOptions:
      - CreateNamespace=false
