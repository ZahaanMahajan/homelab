apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glance
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ZahaanMahajan/homelab.git
    targetRevision: main
    path: kubernetes/applications/glance
    helm:
      releaseName: glance
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: glance
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Replaces the old namespace.yaml (keeps the gateway-access label)
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/name: glance
        app.kubernetes.io/part-of: homelab
        gateway-access: "true"
