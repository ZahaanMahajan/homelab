apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app.kubernetes.io/name: homepage

  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage

    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true

      initContainers:
        - name: config-init
          image: busybox:1.37

          command:
            - sh
            - -c
            - |
              cp -a /config-source/. /app/config/
              chown -R 1000:1000 /app/config

          securityContext:
            runAsUser: 0
            runAsGroup: 0

          volumeMounts:
            - name: homepage-config-source
              mountPath: /config-source
              readOnly: true

            - name: homepage-config
              mountPath: /app/config

      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,homepage.zahaan.online"

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15

          volumeMounts:
            - name: homepage-config
              mountPath: /app/config

            - name: logs
              mountPath: /app/config/logs

      volumes:
        - name: homepage-config-source
          configMap:
            name: homepage

        - name: homepage-config
          emptyDir: {}

        - name: logs
          emptyDir: {}
