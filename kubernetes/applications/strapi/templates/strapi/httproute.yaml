{{- if .Values.gatewayAPI.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "strapi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  parentRefs:
    - name: {{ .Values.gatewayAPI.gateway.name }}
      sectionName: {{ .Values.gatewayAPI.gateway.listener.name }}

  hostnames:
    - {{ .Values.gatewayAPI.gateway.hostname | quote }}

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: {{ include "strapi.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
