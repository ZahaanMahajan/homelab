nameOverride: ""
fullnameOverride: ""
partOf: homelab

image:
  repository: glanceapp/glance
  tag: ""
  pullPolicy: IfNotPresent

secrets:
  github: glance-github

nodeSelector:
  workload: worker-node-01

tolerations:
  - key: workload
    operator: Equal
    value: worker-node-01
    effect: NoSchedule

service:
  type: ClusterIP
  port: 8080

httpRoute:
  enabled: true
  parentRefs:
    - name: shared-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - dashboard.zahaan.online

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

startupProbe:
  tcpSocket:
    port: http
  periodSeconds: 5
  failureThreshold: 12

readinessProbe:
  tcpSocket:
    port: http
  periodSeconds: 5
  failureThreshold: 3

livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  failureThreshold: 3

# ---------------------------------------------------------------------------
# Rendered verbatim (via toYaml) into glance.yml.
# ${GITHUB_TOKEN} is resolved by Glance at runtime from the container env.
# ---------------------------------------------------------------------------
config:
  server:
    port: 8080
    proxied: true

  branding:
    app-name: Zahaan's Homelab
    logo-text: Z
    hide-footer: false
    custom-footer: |
      Powered by <a href="https://github.com/glanceapp/glance">Glance</a> · Homelab

  theme:
    background-color: 225 14 12
    primary-color: 210 80 65
    positive-color: 145 55 55
    negative-color: 0 75 65
    contrast-multiplier: 1.15
    disable-picker: false

  pages:
    - name: Homelab
      slug: home
      width: wide
      hide-desktop-navigation: true

      head-widgets:
        - type: markets
          title: Markets
          markets:
            - {symbol: ^NSEI, name: Nifty 50}
            - {symbol: ^BSESN, name: Sensex}
            - {symbol: ^GSPC, name: S&P 500}
            - {symbol: BTC-USD, name: Bitcoin}
            - {symbol: ETH-USD, name: Ethereum}
            - {symbol: USDINR=X, name: USD/INR}

        - type: search
          search-engine: google
          autofocus: false
          placeholder: Search the web or use !gh !yt !so !k8s
          bangs:
            - {title: GitHub, shortcut: "!gh", url: "https://github.com/search?q={QUERY}"}
            - {title: YouTube, shortcut: "!yt", url: "https://www.youtube.com/results?search_query={QUERY}"}
            - {title: StackOverflow, shortcut: "!so", url: "https://stackoverflow.com/search?q={QUERY}"}
            - {title: Kubernetes Docs, shortcut: "!k8s", url: "https://kubernetes.io/search/?q={QUERY}"}
            - {title: Artifact Hub, shortcut: "!ah", url: "https://artifacthub.io/packages/search?ts_query_web={QUERY}"}

      columns:
        # ---------------- LEFT: personal / at-a-glance ----------------
        - size: small
          widgets:
            - type: clock
              hour-format: 24h
              timezones:
                - {timezone: Asia/Kolkata, label: Kashmir}
                - {timezone: UTC, label: UTC}
                - {timezone: America/New_York, label: New York}
                - {timezone: Europe/London, label: London}

            - type: weather
              location: Srinagar, India
              units: metric
              hour-format: 24h
              show-area-name: true

            - type: calendar
              first-day-of-week: monday

            - type: to-do
              title: Homelab Backlog
              id: homelab-todo

            - type: bookmarks
              title: Quick Access
              groups:
                - title: Homelab
                  links:
                    - {title: ArgoCD, url: "https://argocd.zahaan.online", icon: "si:argo"}
                    - {title: Portfolio, url: "https://portfolio.zahaan.online", icon: "si:vercel"}
                    - {title: Homelab Repository, url: "https://github.com/ZahaanMahajan/homelab", icon: "si:github"}
                - title: Cluster Docs
                  links:
                    - {title: Talos Linux, url: "https://www.talos.dev/docs/", icon: "si:linux"}
                    - {title: Envoy Gateway, url: "https://gateway.envoyproxy.io/docs/", icon: "si:envoyproxy"}
                    - {title: cert-manager, url: "https://cert-manager.io/docs/", icon: "si:letsencrypt"}
                    - {title: MetalLB, url: "https://metallb.io/", icon: "si:kubernetes"}
                - title: Observability
                  links:
                    - {title: Prometheus, url: "https://prometheus.io/docs/", icon: "si:prometheus"}
                    - {title: Grafana, url: "https://grafana.com/docs/", icon: "si:grafana"}
                    - {title: K8s Troubleshooting, url: "https://kubernetes.io/docs/tasks/debug/", icon: "si:kubernetes"}
                - title: Development
                  links:
                    - {title: GitHub, url: "https://github.com/ZahaanMahajan", icon: "si:github"}
                    - {title: Docker Hub, url: "https://hub.docker.com", icon: "si:docker"}
                    - {title: Terraform Registry, url: "https://registry.terraform.io", icon: "si:terraform"}
                    - {title: AWS Docs, url: "https://docs.aws.amazon.com", icon: "si:amazonaws"}
                    - {title: CNCF, url: "https://www.cncf.io/", icon: "si:cncf"}
                    - {title: Artifact Hub, url: "https://artifacthub.io", icon: "si:artifacthub"}

        # ---------------- CENTER: services, releases, repos ----------------
        - size: full
          widgets:
            - type: monitor
              title: Service Availability
              cache: 1m
              sites:
                # Probes the in-cluster Service over plain http because
                # ArgoCD runs with server.insecure=true. Clicking the tile
                # still opens the public URL.
                - title: ArgoCD
                  url: https://argocd.zahaan.online
                  check-url: http://argocd-server.argocd.svc.cluster.local/healthz
                  timeout: 10s
                  icon: "si:argo"
                - title: Portfolio
                  url: https://portfolio.zahaan.online
                  timeout: 10s
                  icon: "si:vercel"
                - title: Homelab Repo
                  url: https://github.com/ZahaanMahajan/homelab
                  icon: "si:github"
                - title: Kubernetes Docs
                  url: https://kubernetes.io/docs/
                  icon: "si:kubernetes"
                - title: Docker Hub
                  url: https://hub.docker.com
                  icon: "si:docker"

            - type: custom-api
              title: GitHub Profile
              cache: 1h
              url: https://api.github.com/users/ZahaanMahajan
              headers:
                Authorization: Bearer ${GITHUB_TOKEN}
                Accept: application/vnd.github+json
              # Go template for Glance, NOT Helm: safe here because Helm never
              # re-parses values.
              template: |
                <div class="flex justify-between text-center margin-block-3">
                  <div>
                    <div class="color-highlight size-h3">{{ .JSON.Int "public_repos" }}</div>
                    <div class="size-h6">REPOS</div>
                  </div>
                  <div>
                    <div class="color-highlight size-h3">{{ .JSON.Int "followers" }}</div>
                    <div class="size-h6">FOLLOWERS</div>
                  </div>
                  <div>
                    <div class="color-highlight size-h3">{{ .JSON.Int "following" }}</div>
                    <div class="size-h6">FOLLOWING</div>
                  </div>
                </div>

            - type: group
              widgets:
                - type: releases
                  title: Platform
                  show-source-icon: true
                  limit: 10
                  collapse-after: 6
                  token: ${GITHUB_TOKEN}
                  repositories:
                    - siderolabs/talos
                    - kubernetes/kubernetes
                    - argoproj/argo-cd
                    - kubernetes-csi/csi-driver-nfs
                - type: releases
                  title: Networking & Security
                  show-source-icon: true
                  limit: 10
                  collapse-after: 6
                  token: ${GITHUB_TOKEN}
                  repositories:
                    - envoyproxy/gateway
                    - cert-manager/cert-manager
                    - metallb/metallb
                - type: releases
                  title: Observability
                  show-source-icon: true
                  limit: 10
                  collapse-after: 6
                  token: ${GITHUB_TOKEN}
                  repositories:
                    - prometheus/prometheus
                    - grafana/grafana
                - type: releases
                  title: Tooling
                  show-source-icon: true
                  limit: 10
                  collapse-after: 6
                  token: ${GITHUB_TOKEN}
                  repositories:
                    - glanceapp/glance
                    - docker/compose
                    - hashicorp/terraform
                    - ansible/ansible

            - type: split-column
              max-columns: 2
              widgets:
                - type: repository
                  repository: ZahaanMahajan/homelab
                  token: ${GITHUB_TOKEN}
                  pull-requests-limit: 5
                  issues-limit: 5
                  commits-limit: 5
                - type: repository
                  repository: argoproj/argo-cd
                  token: ${GITHUB_TOKEN}
                  pull-requests-limit: 3
                  issues-limit: 3
                  commits-limit: 5

            - type: group
              widgets:
                - type: rss
                  title: Kubernetes & CNCF
                  style: detailed-list
                  limit: 12
                  collapse-after: 5
                  feeds:
                    - {url: "https://kubernetes.io/feed.xml", title: Kubernetes Blog}
                    - {url: "https://www.cncf.io/feed/", title: CNCF}
                - type: rss
                  title: Engineering Blogs
                  limit: 15
                  collapse-after: 7
                  feeds:
                    - {url: "https://github.blog/feed/", title: GitHub Blog}
                    - {url: "https://www.docker.com/blog/feed/", title: Docker Blog}
                    - {url: "https://blog.hashicorp.com/feed.xml", title: HashiCorp Blog}

            - type: videos
              title: Homelab & DevOps YouTube
              style: grid-cards
              limit: 15
              channels:
                - UCOk-gHyjcWZNj3Br4oxwh0A   # Techno Tim
                - UCDAck-gFPTrgTx_qp59-bQA   # MischaVanDenBurg
                - UCR-DXc1voovS8nhAvccRZhg   # Jeff Geerling
                - UCgdTVe88YVSrOZ9qKumhULQ   # Hardware Haven 

        # ---------------- RIGHT: system + community feeds ----------------
        - size: small
          widgets:
            - type: server-stats
              title: Glance Host
              servers:
                - type: local
                  name: Cluster Node

            - type: hacker-news
              limit: 12
              collapse-after: 5

            - type: lobsters
              title: Lobsters
              sort-by: hot
              limit: 10
              collapse-after: 5
              tags:
                - devops
                - linux
                - practices
