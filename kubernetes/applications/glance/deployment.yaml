apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: glance
  labels:
    app.kubernetes.io/name: glance
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glance
    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: glance
          image: glanceapp/glance:v0.8.5
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: GLANCE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: glance-auth
                  key: GLANCE_SECRET_KEY

            - name: GLANCE_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: glance-auth
                  key: GLANCE_PASSWORD_HASH

            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: glance-github
                  key: GITHUB_TOKEN

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: glance-config
              mountPath: /app/config
              readOnly: true

      volumes:
        - name: glance-config
          configMap:
            name: glance-config
            items:
              - key: glance.yml
                path: glance.yml
