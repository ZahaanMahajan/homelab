{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "portfolio.fullname" . }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}

  hostnames:
    - {{ .Values.route.hostname }}

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "portfolio.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
