apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.postgres.service.name }}
  labels:
    {{- include "forgejo.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres

spec:
  type: ClusterIP

  selector:
    {{- include "postgres.selectorLabels" . | nindent 4 }}

  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
      protocol: TCP
