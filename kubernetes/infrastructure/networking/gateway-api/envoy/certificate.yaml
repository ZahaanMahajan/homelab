apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-zahaan-online
  namespace: gateway-system
spec:
  secretName: gateway-zahaan-online-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - portfolio.zahaan.online
    - dashboard.zahaan.online
    - git.zahaan.online
