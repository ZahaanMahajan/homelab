apiVersion: v1
kind: PersistentVolume

metadata:
  name: cocktail-postgres-data-pv

spec:
  capacity:
    storage: 10Gi

  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain
  storageClassName: cocktail-nfs-storage

  mountOptions:
    - nfsvers=4.1

  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: "192.168.29.100#kubernetes#pvc-3ea34f18-8408-4dbd-9de0-2d2c35f23e88##"

    volumeAttributes:
      server: 192.168.29.100
      share: /kubernetes
      subdir: pvc-3ea34f18-8408-4dbd-9de0-2d2c35f23e88

