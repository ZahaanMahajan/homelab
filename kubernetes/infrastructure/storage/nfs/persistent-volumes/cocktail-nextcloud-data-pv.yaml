apiVersion: v1
kind: PersistentVolume

metadata:
  name: cocktail-nextcloud-data-pv

spec:
  capacity:
    storage: 100Gi

  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain
  storageClassName: cocktail-nfs-storage

  mountOptions:
    - nfsvers=4.1

  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: "192.168.29.100#kubernetes#pvc-c4c585f7-3c0f-4a1b-b8b3-4f7767295b42##"

    volumeAttributes:
      server: 192.168.29.100
      share: /kubernetes
      subdir: pvc-c4c585f7-3c0f-4a1b-b8b3-4f7767295b42

