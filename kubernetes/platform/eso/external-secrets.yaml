apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd

spec:
  project: default

  sources:
    # Official External Secrets Helm chart
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.15.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/kubernetes/helm-values/external-secrets-values.yaml

    # Git repository containing Helm values
    - repoURL: https://github.com/ZahaanMahajan/homelab.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

