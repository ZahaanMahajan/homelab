# Snippet: place under spec.template.spec for a workload
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: <node-label-key>
              operator: In
              values:
                - <node-label-value>
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: <node-label-key>
              operator: In
              values:
                - <preferred-value>
