apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: <replicaset-name>
  namespace: <namespace>
  labels:
    app: <app-name>
spec:
  replicas: 3
  selector:
    matchLabels:
      app: <app-name>
  template:
    metadata:
      labels:
        app: <app-name>
    spec:
      containers:
        - name: <container-name>
          image: <image>:<tag>
          ports:
            - containerPort: <container-port>
