apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: <networkpolicy-name>
  namespace: <namespace>
spec:
  podSelector:
    matchLabels:
      app: <app-name>
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: <allowed-source-app>
      ports:
        - protocol: TCP
          port: <port>
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: <allowed-destination-app>
      ports:
        - protocol: TCP
          port: <port>
