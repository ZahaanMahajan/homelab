apiVersion: v1
kind: PersistentVolume
metadata:
  name: <pv-name>
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: <storage-class>
  # Replace this backend with the storage type you actually use.
  nfs:
    server: <nfs-server-ip>
    path: <nfs-export-path>
