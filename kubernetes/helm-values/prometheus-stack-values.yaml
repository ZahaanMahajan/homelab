defaultRules:
  create: true

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    storageClassName: cocktail-nfs-storage
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  # Schedules Grafana on talos-worker-03
  nodeSelector:
    kubernetes.io/hostname: "talos-worker-03"
  # Tolerates the worker-node-03 NoSchedule taint
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "worker-node-03"
      effect: "NoSchedule"
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472
  initChownData:
    enabled: false

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 7d
    # Schedules the Prometheus instance on talos-worker-03
    nodeSelector:
      kubernetes.io/hostname: "talos-worker-03"
    # Tolerates the worker-node-03 NoSchedule taint
    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "worker-node-03"
        effect: "NoSchedule"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: cocktail-nfs-storage
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 8Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    # Schedules the Alertmanager instance on talos-worker-03
    nodeSelector:
      kubernetes.io/hostname: "talos-worker-03"
    # Tolerates the worker-node-03 NoSchedule taint
    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "worker-node-03"
        effect: "NoSchedule"
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: cocktail-nfs-storage
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

kubeStateMetrics:
  enabled: true
  # Schedules the kube-state-metrics deployment on talos-worker-03
  nodeSelector:
    kubernetes.io/hostname: "talos-worker-03"
  # Tolerates the worker-node-03 NoSchedule taint
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "worker-node-03"
      effect: "NoSchedule"
  securityContext:
    seccompProfile:
      type: RuntimeDefault

# Left without nodeSelector so it continues running as a DaemonSet across all cluster nodes
# Explicitly added toleration so it can successfully deploy to talos-worker-03
nodeExporter:
  enabled: true
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "worker-node-03"
      effect: "NoSchedule"

prometheusOperator:
  enabled: true
  # Schedules the Prometheus Operator deployment on talos-worker-03
  nodeSelector:
    kubernetes.io/hostname: "talos-worker-03"
  # Tolerates the worker-node-03 NoSchedule taint
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "worker-node-03"
      effect: "NoSchedule"

