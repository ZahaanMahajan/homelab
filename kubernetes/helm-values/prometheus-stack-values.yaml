# Make generated resource names match the existing IngressRoutes
fullnameOverride: "prometheus-kube-prometheus"

defaultRules:
  create: true

grafana:
  enabled: true
  fullnameOverride: "prometheus-grafana"
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    storageClassName: cocktail-nfs-storage
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  # Schedules Grafana on talos-worker-03
  nodeSelector:
    kubernetes.io/hostname: "talos-worker-03"
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "worker-node-03"
      effect: "NoSchedule"
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
  initChownData:
    enabled: false

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: "6GB"   # keeps the TSDB under the 8Gi volume
    # Discover ServiceMonitors/PodMonitors from other releases and namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    nodeSelector:
      kubernetes.io/hostname: "talos-worker-03"
    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "worker-node-03"
        effect: "NoSchedule"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: cocktail-nfs-storage
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 8Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    nodeSelector:
      kubernetes.io/hostname: "talos-worker-03"
    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "worker-node-03"
        effect: "NoSchedule"
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: cocktail-nfs-storage
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  nodeSelector:
    kubernetes.io/hostname: "talos-worker-03"
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "worker-node-03"
      effect: "NoSchedule"
  securityContext:
    seccompProfile:
      type: RuntimeDefault

# Runs as a DaemonSet on all nodes; tolerates the worker-03 taint
nodeExporter:
  enabled: true

prometheus-node-exporter:
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "worker-node-03"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

prometheusOperator:
  enabled: true
  nodeSelector:
    kubernetes.io/hostname: "talos-worker-03"
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "worker-node-03"
      effect: "NoSchedule"

# Talos binds these control-plane components to localhost, so their
# targets would show as down and fire permanent alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
