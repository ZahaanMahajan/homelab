defaultRules:
  create: true

grafana:
  enabled: true
  persistence:
    enabled: true
    type: pvc
    storageClassName: cocktail-nfs-storage
    accessModes:
      - ReadWriteOnce
    size: 5Gi

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: cocktail-nfs-storage
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 8Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: cocktail-nfs-storage
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

prometheusOperator:
  enabled: true

