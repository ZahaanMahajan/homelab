apiVersion: v1
kind: Pod
metadata:
  name: emptydir-test
spec:
  containers:
    - name: test
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Container started at $(date)"
          while true; do
            if [ -f /tmp/restart ]; then
              echo "Restart triggered! Exiting..."
              exit 1
            fi
            sleep 1
          done
      volumeMounts:
        - name: data
          mountPath: /data

  volumes:
    - name: data
      emptyDir: {}
