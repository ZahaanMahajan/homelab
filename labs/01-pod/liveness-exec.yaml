apiVersion: v1
kind: Pod

metadata:
  name: liveness-exec

spec:
  containers:
    - name: nginx
      image: nginx:latest

      command:
        - sh
        - -c
        - |
          touch /tmp/healthy
          nginx -g 'daemon off;'

      livenessProbe:
        exec:
          command:
            - cat
            - /tmp/healthy

        initialDelaySeconds: 5
        periodSeconds: 5
