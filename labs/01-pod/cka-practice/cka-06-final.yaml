apiVersion: v1
kind: Pod

metadata:
  name: cka-final-pod

spec:
  containers:
    - name: nginx
      image: nginx:latest

      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"

      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5
