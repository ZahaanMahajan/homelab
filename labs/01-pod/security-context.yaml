apiVersion: v1
kind: Pod

metadata:
  name: security-context-demo

spec:
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: app
      image: busybox:latest

      command:
        - sh
        - -c
        - sleep 3600

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
