apiVersion: v1
kind: ConfigMap
metadata:
  name: app2-html
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>APP2</title>
    </head>
    <body>
      <h1>Hello from APP2</h1>
      <p>Served through Traefik Ingress.</p>
    </body>
    </html>

  api-index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>APP2 API</title>
    </head>
    <body>
      <h1>Hello from APP2 API</h1>
      <p>Reached through the /api Ingress path.</p>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: nginx:1.25
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: app2-html
            items:
              - key: index.html
                path: index.html
              - key: api-index.html
                path: api/index.html

---
apiVersion: v1
kind: Service
metadata:
  name: app2-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: app2
  ports:
    - port: 80
      targetPort: 80
